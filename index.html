<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云南项目驾驶舱发布包</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3fa;
        font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2a3a;
      }
      .wrap {
        width: min(640px, 92vw);
        background: #fff;
        border: 1px solid #d4deea;
        border-radius: 14px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0 0 12px;
        color: #5b6d83;
      }
      a {
        display: inline-block;
        margin-right: 10px;
        margin-bottom: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        text-decoration: none;
        background: #e8f0ff;
        color: #1d57c2;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>云南项目网页发布包</h1>
      <p>请选择要查看的版本（静态资源已就绪，可直接用于 GitHub Pages）。</p>
      <a href="./v2/">进入 V2</a>
      <a href="./v3/">进入 V3</a>
    </div>
  </body>
</html>
